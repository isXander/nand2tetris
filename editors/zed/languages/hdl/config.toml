name = "Nand2Tetris HDL"
grammar = "hdl"
path_suffixes = ["hdl"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
tab_size = 4
hard_tabs = false
autoclose_before = ";:.,=}])"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
    { start = "/*", end = " */", close = true, newline = false, not_in = ["comment"] },
]
word_characters = ["_"]

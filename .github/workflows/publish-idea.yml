# Signs the IntelliJ plugin and publishes it to the JetBrains Marketplace.
#
# Versioned independently of the Rust crates. Bump `version` in
# editors/idea/build.gradle.kts, then:
#
#   git tag idea-v0.1.0 && git push origin idea-v0.1.0
#
# Secrets: PUBLISH_TOKEN, CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html
#
# The first release of a plugin must be uploaded manually through the
# Marketplace website; this workflow can only publish updates.
name: Publish IntelliJ plugin

on:
  push:
    tags: ["idea-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. idea-v0.1.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/idea
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches the plugin version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts | head -n1)
          if [ "$TAG" != "idea-v$version" ]; then
            echo "::error::tag $TAG does not match editors/idea/build.gradle.kts version $version"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify plugin structure
        run: ./gradlew verifyPluginStructure
      - name: Sign and publish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: editors/idea/build/distributions/*.zip
          if-no-files-found: error
